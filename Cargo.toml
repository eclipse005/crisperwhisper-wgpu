[package]
name = "crisperwhisper-wgpu"
version = "0.1.0"
edition = "2021"
description = "CrisperWhisper 2.0 speech recognition in Rust (CPU first; wgpu planned)"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "crisperwhisper_wgpu"
path = "src/lib.rs"

[[bin]]
name = "transcribe"
path = "src/bin/transcribe.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gemm = "0.18"
gemm-common = "0.18"
half = "2"
hound = "3"
libm = "0.2"
memmap2 = "0.9"
rayon = "1.10"
rustfft = "6"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "flac", "mp3", "pcm", "ogg", "vorbis"] }
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[features]
default = ["cpu"]
cpu = []
# Placeholder for a future wgpu GPU backend. Not implemented in phase 1.
wgpu = []

[build-dependencies]
cmake = "0.1"

[profile.release]
debug = false
